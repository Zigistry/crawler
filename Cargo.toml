[package]
name = "zigistry"
version = "0.0.1"
edition = "2024"

[lib]
path = "src/lib.rs"

[dependencies]
futures = "0.3.31"
tokio = { version = "1.49.0", features = ["full"] }
reqwest = { version = "0.13.1", features = ["json"] }
chrono = "0.4.43"

regex = "1.13.1"
serde = "1.0.229"
serde_derive = "1.0.229"
serde_json = "1.0.151"
serde_with = "3.23.0"
toml = "1.1.6"
libsql = "0.9.30"
dotenv = "0.15.0"
env_logger = "0.11.11"
